    title: '&#FFEE00&lWrite in chat!'
    subtitle: '&7Type the name of your warp'
    bossbar: '&#54ADF4Write the warp name in chat &7(%time%)'
    prompt:
      - ''
      - '&#54ADF4&l» &#FFEE00Write the name of your new warp in the chat.'
      - '&7Letters, numbers and underscores only.'
      - '<gray>Write <white>cancel</white> or <click:run_command:"/aquawarps input cancel"><hover:show_text:"<#FF2D2D>Click to cancel"><#FF2D2D><bold>[Click here]</bold></hover></click><gray> to cancel.'
      - ''
  search:
    title: '&#FFEE00&lWrite in chat!'
    subtitle: '&7Type what you are looking for'
    bossbar: '&#54ADF4Write your search in chat &7(%time%)'
    prompt:
      - ''
      - '&#54ADF4&l» &#FFEE00Write a warp name, an owner or a #tag.'
      - '<gray>Write <white>cancel</white> or <click:run_command:"/aquawarps input cancel"><hover:show_text:"<#FF2D2D>Click to cancel"><#FF2D2D><bold>[Click here]</bold></hover></click><gray> to cancel.'
